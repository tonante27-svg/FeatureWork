<template>
    <lightning-card title="MultiObject Task Creator" icon-name="utility:image">
       <div class="slds-var-p-around_medium">
            <lightning-combobox label="Object Type:" 
                placeholder="Choose ab Object  Type"
                value={selectedObject} 
                onchange={handleObjectChange}
                options={objectOptions}>
                <p>Select option: {value}</p>
            </lightning-combobox>
       </div>
       <!--- Find out how you did the Bus Selector and fit it in here (Lightning component refernce)-->
        <div class="slds-var-p-around_medium">
            <lightning-input type="text" label="Subject:" 
                value={taskSubject} required 
                lwc:ref="subject"
                message-when-value-missing="Subject Is required"
                onchange={handleSubject}>
            </lightning-input>
                <lightning-input type="date" label="Due Date:" 
                value={taskDate} required="true"
                lwc:ref="dueDate"
                message-when-value-missing="Due Date Is required"
                onchange={handleDate}>
            </lightning-input>
        </div>
        <div class="slds-var-p-around_medium">
            <lightning-combobox name="status" label="Status:" 
                placeholder="Choose. Status"
                value={selectedStatus} 
                onchange={handleStatus}
                options={statusOptions}>
                <p>Select option: {value}</p>
            </lightning-combobox>
            <lightning-combobox name="type" label="Type:" 
                placeholder="Choose. Type"
                value={selectedType} 
                onchange={handleType}
                options={typeOptions}>
                <p>Select option: {value}</p>
            </lightning-combobox>
            <lightning-combobox name="type" label="Priority:" 
                placeholder="Choose. Priority"
                value={selectedPriority} 
                onchange={handlePriority}
                options={priorityOptions}>
                <p>Select option: {value}</p>
            </lightning-combobox>
        </div>
    </lightning-card>
        <div class="slds-var-p-around_medium">
            <lightning-button label="Submit" onclick={handleSubmit}></lightning-button>
       </div>
     </lightning-card>
</template>
