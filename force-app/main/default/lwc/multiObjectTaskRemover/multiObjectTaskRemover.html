<template>
    <div class="slds-size_1-of-1 slds-medium-size_8-of-12 slds-large-size_6-of-12">
    <lightning-card title="MultiObject Task Remover" icon-name="utility:image">
       <div class="slds-col slds-size_1-of-2 slds-var-p-left_small">
            <lightning-combobox label="Object Type:" 
                placeholder="Choose an Object Name"
                value={selectedObject} 
                onchange={handleObjectChange}
                options={objectOptions}>
            </lightning-combobox>
       </div>
       <!--- Now Handle the Task Removal-->
        <div class="slds-var-p-around_medium">
            <lightning-button label="Submit" onclick={handleSubmit}></lightning-button>
       </div>
     </lightning-card>
     </div>
</template>
