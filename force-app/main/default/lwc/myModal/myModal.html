<template>
    <lightning-modal-header label="My Modal Component"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-combobox class="slds-p-bottom_xx-large"
            label="Pick a Color" value={currentColor}
            placeholder="Select an option"
            options={colorOptions} onchange={handleChange}></lightning-combobox>
            <lightning-button label="Submit" onclick={handleSubmit} variant="brand">
            </lightning-button>
    </lightning-modal-body>
    
</template>
