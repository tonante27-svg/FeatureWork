<template>
    <lightning-card title="Vehicle Service Display"  icon-name="work_order">
        <div class="slds-var-m-around_medium">
            <p class="slds-var-m-bottom_small">
                <lightning-button
                    label="Load Vehicles"
                    onclick={handleVLoad}
                ></lightning-button>
            </p>
            <template lwc:if={vehicles}>
                <template for:each={vehicles} for:item="vehicle">
                    <p key={vehicle.Id}>{vehilce.Name}{vehicle.make}{vehicle.model}{vehicle.year}</p>
                </template>
            </template>
            <template lwc:elseif={error}>
                <c-error-panel errors={error}></c-error-panel>
            </template>
        </div>
    </lightning-card>
</template>
